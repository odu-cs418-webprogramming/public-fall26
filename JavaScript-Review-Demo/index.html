<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Review Demo</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #eef4fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(760px, 100%);
        background: #ffffff;
        border-radius: 18px;
        box-shadow: 0 18px 45px rgba(21, 57, 94, 0.14);
        padding: clamp(1.5rem, 5vw, 3rem);
      }

      .eyebrow {
        margin: 0 0 0.5rem;
        color: #2266aa;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1,
      h2 {
        margin-top: 0;
      }

      h1 {
        margin-bottom: 0.65rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      .intro {
        margin: 0 0 1.5rem;
        color: #536176;
        line-height: 1.6;
      }

      button {
        border: 0;
        border-radius: 10px;
        background: #2266aa;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
        padding: 0.85rem 1.2rem;
      }

      button:hover {
        background: #184e86;
      }

      button:focus-visible {
        outline: 3px solid #f2b84b;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 1.5rem;
        margin: 1rem 0;
        color: #536176;
      }

      #resultCard {
        margin-top: 1.5rem;
        border-left: 5px solid #f2b84b;
        border-radius: 10px;
        background: #f8fbff;
        padding: 1.25rem;
      }

      #courseList {
        line-height: 1.7;
      }

      pre {
        overflow-x: auto;
        border-radius: 8px;
        background: #172033;
        color: #edf6ff;
        padding: 1rem;
        font-size: 0.9rem;
      }
    </style>
    <script src="javascript-review.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">CS418/518 · JavaScript Refresher</p>
      <h1>Student Course Summary</h1>
      <p class="intro">
        Click the button to turn JavaScript data into a message, a course list,
        and JSON output.
      </p>

      <button id="showSummaryButton" type="button">Show student summary</button>
      <p id="status" role="status" aria-live="polite"></p>

      <section id="resultCard" hidden>
        <h2 id="studentMessage"></h2>
        <h3>Courses</h3>
        <ul id="courseList"></ul>
        <h3>JSON sent to an API</h3>
        <pre id="jsonOutput"></pre>
      </section>
    </main>
  </body>
</html>
